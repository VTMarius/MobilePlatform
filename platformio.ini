[platformio]
default_envs = lilygo_t3

[env]
platform = espressif32@6.12.0
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_speed = 460800
lib_deps =
    adafruit/Adafruit BNO08x@1.2.7
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit SSD1306@2.5.17
build_flags =
    -Wall
    -Wextra

[env:lilygo_t3]
build_flags = ${env.build_flags} -DMOBILE_DISPLAY_ENABLED=1

[env:lilygo_t3_serial]
build_flags = ${env.build_flags} -DMOBILE_DISPLAY_ENABLED=0

[env:lilygo_t3_display]
build_flags = ${env.build_flags} -DMOBILE_DISPLAY_ENABLED=1 -DMOBILE_IMU_ENABLED=0
